name: Build and deploy Hugo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugo-production
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.150.0

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          install -d -m 700 "$ssh_dir"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/id_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          test -s "$ssh_dir/id_deploy"
          test -s "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_deploy" "$ssh_dir/known_hosts"

      - name: Prepare remote release directory
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          release_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_options=(-i "$ssh_dir/id_deploy" -o IdentitiesOnly=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes -o LogLevel=ERROR)

          # DEPLOY_PATH is sent as data over stdin, not embedded in a remote command.
          {
            printf '%s\n' "$DEPLOY_PATH"
            printf '%s\n' "$release_id"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          IFS= read -r deploy_path
          IFS= read -r release_id
          test -n "$deploy_path"
          test "${deploy_path#/}" != "$deploy_path"
          test "$deploy_path" != "/"
          test -d "$deploy_path"
          release_dir="${deploy_path}.release-${release_id}"
          rm -rf -- "$release_dir"
          install -d -m 755 -- "$release_dir"
          printf '%s' "$release_dir"
          REMOTE_SCRIPT
          } | ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s > "$RUNNER_TEMP/release-dir"

          release_dir="$(<"$RUNNER_TEMP/release-dir")"
          test -n "$release_dir"
          printf '%s\n' "$release_dir" > "$RUNNER_TEMP/release-dir"

      - name: Upload generated site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          release_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf -v ssh_options 'ssh -i %q -o IdentitiesOnly=yes -o UserKnownHostsFile=%q -o StrictHostKeyChecking=yes -o LogLevel=ERROR' \
            "$ssh_dir/id_deploy" "$ssh_dir/known_hosts"
          rsync --archive --delete --delay-updates --quiet \
            -e "ssh $ssh_options" \
            public/ "$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PATH}.release-${release_id}/"

      - name: Back up and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          release_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_options=(-i "$ssh_dir/id_deploy" -o IdentitiesOnly=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes -o LogLevel=ERROR)

          # Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY,
          # and DEPLOY_KNOWN_HOSTS. Populate DEPLOY_KNOWN_HOSTS after verifying the
          # server fingerprint out of band, for example with a reviewed ssh-keyscan.
          # Never use StrictHostKeyChecking=no and never store a server private key here.
          {
            printf '%s\n' "$DEPLOY_PATH"
            printf '%s\n' "$release_id"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          IFS= read -r deploy_path
          IFS= read -r release_id
          test -n "$deploy_path"
          test "${deploy_path#/}" != "$deploy_path"
          test "$deploy_path" != "/"
          test -d "$deploy_path"
          release_dir="${deploy_path}.release-${release_id}"
          test -f "$release_dir/index.html"

          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup_dir="${deploy_path}.backup-${timestamp}-${release_id}"
          test ! -e "$backup_dir"
          install -d -m 755 -- "$backup_dir"
          cp -a -- "$deploy_path"/. "$backup_dir"/

          # Keep the document-root path stable for the web server while rsync delays updates.
          rsync --archive --delete --delay-updates -- "$release_dir"/ "$deploy_path"/
          test -f "$deploy_path/index.html"
          rm -rf -- "$release_dir"
          REMOTE_SCRIPT
          } | ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s

      - name: Check deployed routes
        run: |
          set -euo pipefail
          for route in / /about/ /experience/ /projects/ /blog/ /robots.txt /sitemap.xml; do
            curl --fail --silent --show-error --location --max-time 20 --output /dev/null "https://haoyong.fan${route}"
          done
