name: Build and deploy Hugo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugo-production
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.150.0
  DEPLOY_LOCK_LEASE_SECONDS: 1800

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Hugo Extended
        # peaceiris/actions-hugo v3.0.0
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          install -d -m 700 "$ssh_dir"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/id_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          test -s "$ssh_dir/id_deploy"
          test -s "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_deploy" "$ssh_dir/known_hosts"

      - name: Acquire remote deployment lock
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          lock_owner="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          lock_lease_seconds="$DEPLOY_LOCK_LEASE_SECONDS"
          printf '%s\n' "$lock_owner" > "$RUNNER_TEMP/deploy-lock-owner"
          ssh_options=(-i "$ssh_dir/id_deploy" -o IdentitiesOnly=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes -o LogLevel=ERROR)

          {
            printf 'deploy_path=%q\n' "$DEPLOY_PATH"
            printf 'lock_owner=%q\n' "$lock_owner"
            printf 'lock_lease_seconds=%q\n' "$lock_lease_seconds"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          test -n "$deploy_path"
          test "${deploy_path#/}" != "$deploy_path"
          test "$deploy_path" != "/"
          parent_dir="$(dirname -- "$deploy_path")"
          test -d "$parent_dir"
          release_root="${deploy_path}.releases"

          # DEPLOY_PATH must already be a live symlink into the release root.
          # The operator creates this baseline once during server setup.
          if ! test -L "$deploy_path"; then
            printf '%s\n' "DEPLOY_PATH must be an existing symlink into ${deploy_path}.releases; complete one-time server setup first" >&2
            exit 1
          fi
          test -d "$release_root"
          test ! -L "$release_root"
          release_root_real="$(readlink -f -- "$release_root")"
          test -n "$release_root_real"
          test "$release_root_real" != "/"
          current_dir="$(readlink -f -- "$deploy_path")"
          test -n "$current_dir"
          test -d "$current_dir"
          test "$current_dir" != "$release_root_real"
          case "$current_dir/" in
            "$release_root_real"/*) ;;
            *)
              printf '%s\n' "refusing external DEPLOY_PATH symlink target: $current_dir" >&2
              exit 1
              ;;
          esac

          lock_dir="${deploy_path}.deploy.lock"
          test ! -L "$lock_dir"
          if ! mkdir -m 700 -- "$lock_dir" 2>/dev/null; then
            printf '%s\n' "deployment lock is already held: $lock_dir" >&2
            test -d "$lock_dir"
            test ! -L "$lock_dir"
            test -f "$lock_dir/owner"
            IFS= read -r held_owner < "$lock_dir/owner"
            IFS= read -r acquired_epoch < <(sed -n '2p' "$lock_dir/owner")
            case "$held_owner" in
              ''|*[!A-Za-z0-9_.:-]*)
                printf '%s\n' "deployment lock has invalid owner metadata" >&2
                exit 1
                ;;
            esac
            case "$acquired_epoch" in
              ''|*[!0-9]*)
                printf '%s\n' "deployment lock has invalid lease metadata: $held_owner" >&2
                exit 1
                ;;
            esac
            now_epoch="$(date +%s)"
            lock_age=$((now_epoch - acquired_epoch))
            if ((lock_age < 0 || lock_age <= lock_lease_seconds)); then
              printf '%s\n' "deployment lock is active: $held_owner (age ${lock_age}s, lease ${lock_lease_seconds}s)" >&2
              exit 1
            fi
            recovery_dir="${lock_dir}.expired-${now_epoch}-${lock_owner}"
            test ! -e "$recovery_dir"
            if ! mv -- "$lock_dir" "$recovery_dir"; then
              printf '%s\n' "deployment lock changed during stale-lock recovery" >&2
              exit 1
            fi
            rm -rf -- "$recovery_dir"
            mkdir -m 700 -- "$lock_dir"
          fi
          cleanup_lock() { rm -rf -- "$lock_dir"; }
          trap cleanup_lock EXIT
          printf '%s\n%s\n%s\nlease_seconds=%s\n' "$lock_owner" "$(date +%s)" "$(hostname)" "$lock_lease_seconds" > "$lock_dir/owner"
          trap - EXIT
          REMOTE_SCRIPT
          } | ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s

      - name: Prepare remote release directory
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          release_id="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$release_id" > "$RUNNER_TEMP/release-id"
          ssh_options=(-i "$ssh_dir/id_deploy" -o IdentitiesOnly=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes -o LogLevel=ERROR)

          # DEPLOY_PATH is sent as a shell-quoted assignment over stdin, not embedded
          # in a remote command. The server must already have its web server configured
          # to serve DEPLOY_PATH.
          # Releases live under DEPLOY_PATH.releases/release-* and rollback backups are
          # siblings named .backup-*.
          # DEPLOY_PATH must be prepared as an in-root release symlink before CI runs.
          # This workflow never converts a real document root or edits web-server configuration.
          {
            printf 'deploy_path=%q\n' "$DEPLOY_PATH"
            printf 'release_id=%q\n' "$release_id"
            printf 'lock_owner=%q\n' "$(<"$RUNNER_TEMP/deploy-lock-owner")"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          lock_dir="${deploy_path}.deploy.lock"
          test -d "$lock_dir"
          test ! -L "$lock_dir"
          test -f "$lock_dir/owner"
          IFS= read -r lock_owner_on_host < "$lock_dir/owner"
          test "$lock_owner_on_host" = "$lock_owner"
          if ! test -L "$deploy_path"; then
            printf '%s\n' "DEPLOY_PATH must already be a symlink into its .releases root; complete one-time server setup first" >&2
            exit 1
          fi
          test -n "$deploy_path"
          test "${deploy_path#/}" != "$deploy_path"
          test "$deploy_path" != "/"
          parent_dir="$(dirname -- "$deploy_path")"
          test -d "$parent_dir"
          release_root="${deploy_path}.releases"
          test -d "$release_root"
          test ! -L "$release_root"
          release_root_real="$(readlink -f -- "$release_root")"
          test -n "$release_root_real"
          test "$release_root_real" != "/"
          current_dir="$(readlink -f -- "$deploy_path")"
          test -n "$current_dir"
          test -d "$current_dir"
          test "$current_dir" != "$release_root_real"
          case "$current_dir/" in
            "$release_root_real"/*) ;;
            *)
              printf '%s\n' "refusing external DEPLOY_PATH symlink target: $current_dir" >&2
              exit 1
              ;;
          esac

          release_dir="${release_root}/release-${release_id}"
          backup_dir="${deploy_path}.backup-${release_id}"
          test ! -e "$release_dir"
          test ! -L "$release_dir"
          test ! -e "$backup_dir"
          test ! -L "$backup_dir"

          mkdir -m 755 -- "$backup_dir"
          cp -a -- "$current_dir"/. "$backup_dir"/

          mkdir -m 755 -- "$release_dir"
          printf '%s\n%s\n' "$release_dir" "$current_dir"
          REMOTE_SCRIPT
          } | ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s > "$RUNNER_TEMP/release-dir"

          mapfile -t remote_values < "$RUNNER_TEMP/release-dir"
          test "${#remote_values[@]}" -eq 2
          release_dir="${remote_values[0]}"
          expected_current_dir="${remote_values[1]}"
          test -n "$release_dir"
          printf '%s\n' "$release_dir" > "$RUNNER_TEMP/release-dir"
          printf '%s\n' "$expected_current_dir" > "$RUNNER_TEMP/expected-current"

      - name: Upload generated site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          release_id="$(<"$RUNNER_TEMP/release-id")"
          release_root="${DEPLOY_PATH}.releases"
          printf -v ssh_options 'ssh -i %q -o IdentitiesOnly=yes -o UserKnownHostsFile=%q -o StrictHostKeyChecking=yes -o LogLevel=ERROR' \
            "$ssh_dir/id_deploy" "$ssh_dir/known_hosts"
          rsync --archive --delete --delay-updates --quiet \
            -e "$ssh_options" \
            public/ "$DEPLOY_USER@$DEPLOY_HOST:${release_root}/release-${release_id}/"

      - name: Activate and retain release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          release_id="$(<"$RUNNER_TEMP/release-id")"
          expected_current_dir="$(<"$RUNNER_TEMP/expected-current")"
          ssh_options=(-i "$ssh_dir/id_deploy" -o IdentitiesOnly=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes -o LogLevel=ERROR)

          # Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY,
          # and DEPLOY_KNOWN_HOSTS. Populate DEPLOY_KNOWN_HOSTS after verifying the
          # server fingerprint out of band, for example with a reviewed ssh-keyscan.
          # Never use StrictHostKeyChecking=no and never store a server private key here.
          {
            printf 'deploy_path=%q\n' "$DEPLOY_PATH"
            printf 'release_id=%q\n' "$release_id"
            printf 'expected_current_dir=%q\n' "$expected_current_dir"
            printf 'lock_owner=%q\n' "$(<"$RUNNER_TEMP/deploy-lock-owner")"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          lock_dir="${deploy_path}.deploy.lock"
          test -d "$lock_dir"
          test ! -L "$lock_dir"
          test -f "$lock_dir/owner"
          IFS= read -r lock_owner_on_host < "$lock_dir/owner"
          test "$lock_owner_on_host" = "$lock_owner"
          test -L "$deploy_path"
          test -n "$deploy_path"
          test "${deploy_path#/}" != "$deploy_path"
          test "$deploy_path" != "/"
          release_root="${deploy_path}.releases"
          test -d "$release_root"
          test ! -L "$release_root"
          release_root_real="$(readlink -f -- "$release_root")"
          test -n "$release_root_real"
          test "$release_root_real" != "/"
          release_dir="${release_root}/release-${release_id}"
          test -d "$release_dir"
          test ! -L "$release_dir"
          release_dir_real="$(readlink -f -- "$release_dir")"
          test "$release_dir_real" != "$release_root_real"
          case "$release_dir_real/" in
            "$release_root_real"/*) ;;
            *)
              printf '%s\n' "refusing external release directory: $release_dir_real" >&2
              exit 1
              ;;
          esac
          test -f "$release_dir/index.html"
          test ! -L "$release_dir/index.html"

          current_dir="$(readlink -f -- "$deploy_path")"
          test -n "$current_dir"
          test -d "$current_dir"
          test "$current_dir" = "$expected_current_dir"
          test "$current_dir" != "$release_root_real"
          case "$current_dir/" in
            "$release_root_real"/*) ;;
            *)
              printf '%s\n' "refusing changed DEPLOY_PATH target: $current_dir" >&2
              exit 1
              ;;
          esac
          activation_link="${deploy_path}.activate-${release_id}"
          test ! -e "$activation_link"
          test ! -L "$activation_link"
          ln -s -- "$release_dir" "$activation_link"
          test -f "$activation_link/index.html"
          mv -Tf -- "$activation_link" "$deploy_path"
          test -L "$deploy_path"
          test -f "$deploy_path/index.html"

          active_release="$(readlink -f -- "$deploy_path")"
          test "$active_release" = "$(readlink -f -- "$release_dir")"

          # Keep the active release plus the five newest timestamped release/backup
          # directories. Only these workflow-owned artifact names are pruned.
          shopt -s nullglob
          artifacts=("${release_root}/release-"* "${deploy_path}.backup-"*)
          if ((${#artifacts[@]} > 0)); then
            mapfile -t artifacts < <(printf '%s\n' "${artifacts[@]}" | sort -r)
          fi
          retained=0
          for artifact in "${artifacts[@]}"; do
            test -d "$artifact"
            test ! -L "$artifact"
            if test "$(readlink -f -- "$artifact")" = "$active_release"; then
              continue
            fi
            if ((retained < 5)); then
              retained=$((retained + 1))
              continue
            fi
            rm -rf -- "$artifact"
          done
          REMOTE_SCRIPT
          } | ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s

      - name: Check deployed routes
        run: |
          set -euo pipefail
          for route in / /about/ /experience/ /projects/ /blog/ /robots.txt /sitemap.xml; do
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 20 --output /dev/null "https://haoyong.fan${route}"
          done

      - name: Release remote deployment lock
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          if test ! -s "$RUNNER_TEMP/deploy-lock-owner"; then
            exit 0
          fi
          lock_owner="$(<"$RUNNER_TEMP/deploy-lock-owner")"
          ssh_options=(-i "$ssh_dir/id_deploy" -o IdentitiesOnly=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes -o LogLevel=ERROR)

          {
            printf 'deploy_path=%q\n' "$DEPLOY_PATH"
            printf 'lock_owner=%q\n' "$lock_owner"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          test -n "$deploy_path"
          test "${deploy_path#/}" != "$deploy_path"
          test "$deploy_path" != "/"
          lock_dir="${deploy_path}.deploy.lock"
          if ! test -e "$lock_dir"; then
            exit 0
          fi
          test -d "$lock_dir"
          test ! -L "$lock_dir"
          test -f "$lock_dir/owner"
          IFS= read -r lock_owner_on_host < "$lock_dir/owner"
          test "$lock_owner_on_host" = "$lock_owner"
          rm -rf -- "$lock_dir"
          REMOTE_SCRIPT
          } | ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s
