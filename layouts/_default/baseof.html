<!doctype html>
<html lang="{{ site.Language.Lang | htmlEscape }}">

    {{ partial "head.html" . }}
  </head>
  <body>
    {{ partial "header.html" . }}

    <main id="main-content" class="site-main">
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}
    <script src="{{ "js/site.js" | relURL }}" defer></script>
  </body>
</html>
