{{ define "main" }}
  <section class="page page--blog">
    {{ partial "page-heading.html" . }}
    {{ $posts := where .Pages "Draft" false }}
    {{ $posts = sort $posts "Date" "desc" }}
    {{ if $posts }}<div class="post-list">{{ range $posts }}{{ partial "card-post.html" . }}{{ end }}</div>{{ else }}<p>No published posts yet.</p>{{ end }}
  </section>
{{ end }}
