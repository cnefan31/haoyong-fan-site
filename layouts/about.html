{{ define "main" }}
  <article class="page page--about">
    {{ partial "page-heading.html" . }}
    {{ with .Params.name }}<p class="about-name">{{ . }}</p>{{ end }}
    {{ with .Params.bio }}<p class="about-bio">{{ . }}</p>{{ end }}
    <div class="prose">{{ .Content }}</div>
    {{ with .Params.skills }}
      <section class="skills" aria-labelledby="skills-title">
        <h2 id="skills-title">Skills</h2>
        <ul class="tag-list">{{ range . }}<li>{{ . }}</li>{{ end }}</ul>
      </section>
    {{ end }}
  </article>
{{ end }}
