{{ define "main" }}
  <article class="page page--entry">
    {{ partial "page-heading.html" . }}
    <p class="entry-meta">{{ .Params.company }}{{ with .Params.period }} · {{ . }}{{ end }}</p>
    <div class="prose">{{ .Content }}</div>
    {{ with .Params.technologies }}<ul class="tag-list" aria-label="技术栈">{{ range . }}<li>{{ . }}</li>{{ end }}</ul>{{ end }}
  </article>
{{ end }}
