{{ define "main" }}
  <article class="page page--entry">
    {{ partial "page-heading.html" . }}
    <p class="entry-meta">{{ .Params.company | htmlEscape }}{{ with .Params.period }} · {{ . | htmlEscape }}{{ end }}</p>
    <div class="prose">{{ .Content }}</div>
    {{ with .Params.technologies }}<ul class="tag-list" aria-label="Technologies">{{ range . }}<li>{{ . | htmlEscape }}</li>{{ end }}</ul>{{ end }}
  </article>
{{ end }}
