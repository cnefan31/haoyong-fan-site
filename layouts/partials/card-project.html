{{/* Always link to the project's own page; the external repo link lives there. */}}
<a
  class="project-card"
  href="{{ .RelPermalink }}"
  aria-label="{{ .Title }}"
>
  <div class="card__meta">
    <span class="card__category">{{ printf "%02d" .Params.weight }}</span>
  </div>
  <h3 class="card__title">{{ .Title }}</h3>
  {{ with .Params.description }}<p class="card__description">{{ . }}</p>{{ end }}
  {{ with .Params.technologies }}
    <ul class="card__tags" aria-label="技术栈">
      {{ range . }}<li>{{ . }}</li>{{ end }}
    </ul>
  {{ end }}
  <span class="card__arrow" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M12 5l7 7-7 7" />
    </svg>
  </span>
</a>
