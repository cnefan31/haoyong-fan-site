<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="{{ site.Home.RelPermalink }}" aria-label="Haoyong Fan home">
      <span class="site-brand__mark" aria-hidden="true">HF</span>
      <span class="site-brand__text">haoyong.fan</span>
    </a>

    <button
      class="mobile-menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="mobile-navigation"
    >
      <span class="mobile-menu-toggle__label">Menu</span>
    </button>

    {{ partial "nav.html" (dict "page" . "variant" "desktop") }}
  </div>

  <div id="mobile-navigation" class="mobile-navigation">
    {{ partial "nav.html" (dict "page" . "variant" "mobile") }}
  </div>
</header>
