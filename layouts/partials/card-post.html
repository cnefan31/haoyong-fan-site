<article class="post-card">
  <p class="post-card__date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年1月2日" }}</time></p>
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  {{ with .Summary }}<p>{{ . | plainify }}</p>{{ end }}
  {{ with .Params.tags }}
    <ul class="tag-list" aria-label="标签">
      {{ range . }}<li><a href="{{ (printf "/tags/%s/" (. | urlize)) | relURL }}">{{ partial "tag-label.html" . }}</a></li>{{ end }}
    </ul>
  {{ end }}
</article>
