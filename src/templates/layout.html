<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{page-title}}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/fluent.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github.min.css">
</head>
<body>
  <!-- Mobile header -->
  <div class="mobile-header">
    <button class="mobile-menu-btn" onclick="App.toggleMobileMenu()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
        <path d="M2 4h14v1.5H2V4zm0 4h14v1.5H2V8zm0 4h9v1.5H2V12z"/>
      </svg>
    </button>
  </div>

  <!-- Mobile overlay -->
  <div class="mobile-overlay" onclick="App.toggleMobileMenu()"></div>

  <!-- Mobile sidebar -->
  <aside class="mobile-sidebar">
    <button class="mobile-close" onclick="App.toggleMobileMenu()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M3 3l10 10M13 3L3 13"/>
      </svg>
    </button>
    <nav class="mobile-nav">
      <a href="/index.html" class="mobile-nav-item" data-page="about">About</a>
      <a href="/experience.html" class="mobile-nav-item" data-page="experience">Experience</a>
      <a href="/projects.html" class="mobile-nav-item" data-page="projects">Projects</a>
      <a href="/blog.html" class="mobile-nav-item" data-page="blog">Blog</a>
    </nav>
    <div class="mobile-footer">
      <a href="https://github.com/" target="_blank">GitHub</a>
    </div>
  </aside>

  <!-- Desktop Sidebar -->
  <aside class="sidebar" id="sidebar">
    <!-- Nav -->
    <nav class="sidebar-nav">
      <a href="/index.html" class="sidebar-item" data-page="about" title="About">
        <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="7" r="3"/>
          <path d="M3 18v-1a7 7 0 0 1 14 0v1"/>
        </svg>
        <span class="sidebar-label">About</span>
      </a>
      <a href="/experience.html" class="sidebar-item" data-page="experience" title="Experience">
        <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="16" height="12" rx="2"/>
          <path d="M6 4V3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v1"/>
          <line x1="6" y1="9" x2="6" y2="13"/>
          <line x1="10" y1="9" x2="10" y2="13"/>
          <line x1="14" y1="9" x2="14" y2="13"/>
        </svg>
        <span class="sidebar-label">Experience</span>
      </a>
      <a href="/projects.html" class="sidebar-item" data-page="projects" title="Projects">
        <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="7" height="7" rx="1.5"/>
          <rect x="11" y="2" width="7" height="7" rx="1.5"/>
          <rect x="2" y="11" width="7" height="7" rx="1.5"/>
          <rect x="11" y="11" width="7" height="7" rx="1.5"/>
        </svg>
        <span class="sidebar-label">Projects</span>
      </a>
      <a href="/blog.html" class="sidebar-item" data-page="blog" title="Blog">
        <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h12v12H4z" rx="1.5"/>
          <path d="M7 8h6"/>
          <path d="M7 11h4"/>
        </svg>
        <span class="sidebar-label">Blog</span>
      </a>
    </nav>

    <!-- GitHub -->
    <a href="https://github.com/" class="sidebar-item sidebar-github" data-page="github" title="GitHub" target="_blank">
      <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
        <path d="M10 0C4.48 0 0 4.48 0 10c0 4.42 2.87 8.17 6.84 9.5.5.09.68-.22.68-.48 0-.24-.01-.88-.01-1.73-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02.8-.22 1.65-.33 2.5-.33.85 0 1.7.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85 0 1.34-.01 2.41-.01 2.74 0 .27.18.58.69.48A10.01 10.01 0 0 0 20 10c0-5.52-4.48-10-10-10z"/>
      </svg>
      <span class="sidebar-label">GitHub</span>
    </a>

    <!-- Toggle button — absolutely at bottom -->
    <button class="sidebar-toggle" onclick="App.toggleSidebar()" title="Toggle sidebar" id="sidebarToggle">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" id="toggleIcon">
        <path d="M9 2L3 7l6 5V2z" fill="currentColor"/>
      </svg>
    </button>
  </aside>

  <!-- Main content -->
  <main class="main-content">
    {{content}}
  </main>

  <script src="/main.js"></script>
</body>
</html>
